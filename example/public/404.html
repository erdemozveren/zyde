<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Not Found</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0;
      font-size: 6rem;
      line-height: 1;
    }

    p {
      margin: 1rem 0 1.5rem;
      color: #666;
    }

    a {
      display: inline-block;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      background: #222;
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go back home</a>
  </main>
</body>
</html>
